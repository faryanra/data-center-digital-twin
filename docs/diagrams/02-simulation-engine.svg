<svg viewBox="0 0 840 580" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="579" rx="10" fill="#FAFBFC" stroke="#E5E7EB"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#374151">Simulation Engine</text>

  <!-- Broadcast loop -->
  <rect x="320" y="66" width="200" height="52" rx="9" fill="#E7F6EC" stroke="#16A34A" stroke-width="1.5"/>
  <text x="420" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#15803D">Broadcast Loop</text>

  <line x1="420" y1="118" x2="420" y2="160" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="432" y="144" font-size="12.5" fill="#64748B">tick() every 5 s</text>

  <!-- FacilitySimulator -->
  <rect x="300" y="162" width="240" height="56" rx="9" fill="#E7F6EC" stroke="#16A34A" stroke-width="1.5"/>
  <text x="420" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#15803D">FacilitySimulator</text>

  <line x1="420" y1="218" x2="420" y2="258" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- FacilitySnapshot -->
  <rect x="305" y="260" width="230" height="52" rx="9" fill="#E8F1FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="420" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">FacilitySnapshot</text>

  <!-- snapshot to bus -->
  <line x1="420" y1="312" x2="420" y2="350" stroke="#94A3B8" stroke-width="1.6"/>
  <line x1="200" y1="350" x2="640" y2="350" stroke="#CBD5E1" stroke-width="1.6"/>
  <line x1="200" y1="350" x2="200" y2="386" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="420" y1="350" x2="420" y2="386" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="640" y1="350" x2="640" y2="386" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- consumers -->
  <rect x="110" y="388" width="180" height="52" rx="9" fill="#E8F1FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="200" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">WebSocket</text>

  <rect x="330" y="388" width="180" height="52" rx="9" fill="#FFF1E6" stroke="#EA580C" stroke-width="1.5"/>
  <text x="420" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#C2410C">MQTT</text>

  <rect x="550" y="388" width="180" height="52" rx="9" fill="#FFF1E6" stroke="#EA580C" stroke-width="1.5"/>
  <text x="640" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#C2410C">Modbus TCP</text>

  <!-- ATS state machine -->
  <text x="28" y="478" font-size="14" font-weight="700" fill="#475569">Generator ATS</text>

  <rect x="40"  y="490" width="150" height="46" rx="9" fill="#EEF0F2" stroke="#64748B" stroke-width="1.5"/>
  <text x="115" y="518" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">STANDBY</text>

  <line x1="190" y1="513" x2="228" y2="513" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="230" y="490" width="150" height="46" rx="9" fill="#FEF3E2" stroke="#D97706" stroke-width="1.5"/>
  <text x="305" y="518" text-anchor="middle" font-size="14" font-weight="600" fill="#B45309">STARTING</text>

  <line x1="380" y1="513" x2="418" y2="513" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="420" y="490" width="160" height="46" rx="9" fill="#E7F6EC" stroke="#16A34A" stroke-width="1.5"/>
  <text x="500" y="518" text-anchor="middle" font-size="14" font-weight="600" fill="#15803D">TRANSFERRED</text>

  <line x1="580" y1="513" x2="618" y2="513" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="620" y="490" width="150" height="46" rx="9" fill="#FEF3E2" stroke="#D97706" stroke-width="1.5"/>
  <text x="695" y="518" text-anchor="middle" font-size="14" font-weight="600" fill="#B45309">RECOVERY</text>

  <!-- loop back to STANDBY (orthogonal, connected) -->
  <path d="M695,536 L695,558 L115,558 L115,538" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
