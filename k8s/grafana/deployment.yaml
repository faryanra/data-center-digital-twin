---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: dctwin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3001
          env:
            - name: GF_SERVER_HTTP_PORT
              value: "3001"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "CHANGE_ME_IN_PRODUCTION"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: dctwin
spec:
  selector:
    app: grafana
  ports:
    - port: 3001
      targetPort: 3001
